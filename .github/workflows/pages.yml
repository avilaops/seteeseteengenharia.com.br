name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Separa os arquivos publicados
        run: |
          mkdir _site
          cp "logo.png" "avilaops-indexnow-20260730.txt" "site.webmanifest" "logo.svg" "sitemap.xml" "favicon-96x96.png" "logo_full.jpg" "index.html" "logo_icon.png" "og-default.png" "favicon.svg" "favicon.ico" "apple-touch-icon.png" "robots.txt" _site/
          cp -r assets img _site/
      - name: Check out public discovery publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: avilaops/motor-web
          ref: a1bba366c848bf2df3634cba6de2649a8626435c
          path: .publicacao-descoberta
          persist-credentials: false
      - name: Install public discovery publisher
        working-directory: .publicacao-descoberta
        run: npm ci --ignore-scripts --omit=dev
      - name: Install pinned prerender browser
        timeout-minutes: 5
        run: |
          npm install --prefix .prerender-deps --ignore-scripts --no-package-lock --no-audit --no-fund --save-exact playwright@1.62.0
          node .prerender-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prerender the public root
        timeout-minutes: 5
        run: node scripts/prerender-root.mjs --modo gerar
      - name: Generate public discovery and WebMCP
        run: node .publicacao-descoberta/bin/publicar-descoberta.mjs --diretorio _site --origem https://seteeseteengenharia.com.br
      - name: Verify root content, visual and hash routing
        timeout-minutes: 5
        run: node scripts/prerender-root.mjs --modo verificar
      - name: Prerender every public route and verify direct navigation
        timeout-minutes: 5
        run: node scripts/prerender-pages.mjs
      - name: Generate canonical metadata, image sitemaps and public text
        run: |
          node .publicacao-descoberta/bin/publicar-seo.mjs --diretorio _site --configuracao seo.config.json --repositorio .
          node .publicacao-descoberta/bin/publicar-texto.mjs --diretorio _site --origem https://seteeseteengenharia.com.br --indexar-texto
          node .publicacao-descoberta/bin/publicar-descoberta.mjs --diretorio _site --origem https://seteeseteengenharia.com.br
      - name: Preserve prerender verification evidence
        if: always() && hashFiles('.prerender-check/baseline.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prerender-evidence
          path: .prerender-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-pages-site
          path: _site
          include-hidden-files: true
      - name: Publicar no Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: 85b914dcdebf6fa2fce7b819bc542294
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package=wrangler@4.161.0 wrangler pages deploy _site --project-name=seteeseteengenharia --branch=main --commit-hash=${{ github.sha }}
